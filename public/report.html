<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Report</title>
<style>
body{font-family:system-ui,Arial;background:#f4f6f8;margin:0;color:#17202a}.wrap{max-width:1000px;margin:25px auto;padding:0 15px}
.card{background:#fff;padding:20px;border-radius:16px;margin-bottom:15px;box-shadow:0 5px 20px #0001}
pre{background:#111827;color:#e5e7eb;padding:18px;border-radius:12px;overflow:auto;white-space:pre-wrap}
a{display:inline-block;margin-bottom:15px}
</style></head>
<body><div class="wrap">
<a href="/">← Reports</a>
<div class="card"><h1>Device Report</h1><div id="meta">Loading...</div></div>
<div class="card"><pre id="out">Loading...</pre></div>
</div>
<script>
(async()=>{
 const f=new URLSearchParams(location.search).get("file");
 if(!f){document.getElementById("out").textContent="No report selected.";return}
 const r=await fetch("/api/reports/"+encodeURIComponent(f));
 const data=await r.json();
 document.getElementById("meta").innerHTML=
   "<b>Date & Time:</b> "+(data.collectedAtLocal||new Date(data.collectedAt).toLocaleString("en-IN"))+
   "<br><b>File:</b> "+f;
 document.getElementById("out").textContent=JSON.stringify(data,null,2);
})()
</script>
</body></html>
